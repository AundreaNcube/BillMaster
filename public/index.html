<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice System - BitBuilders Code Race</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Invoice System</h1>
            <p>Create and manage invoices for your retail shop</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="create">Create Invoice</button>
            <button class="tab-btn" data-tab="view">View Invoices</button>
        </div>

        <!-- Create Invoice Tab -->
        <div id="create-tab" class="tab-content active">
            <form id="invoice-form">
                <div class="form-section">
                    <h2>Customer Information</h2>
                    <div class="form-group">
                        <label for="customer_name">Customer Name *</label>
                        <input type="text" id="customer_name" name="customer_name" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer_email">Email</label>
                            <input type="email" id="customer_email" name="customer_email">
                        </div>
                        
                        <div class="form-group">
                            <label for="customer_phone">Phone</label>
                            <input type="tel" id="customer_phone" name="customer_phone">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Items</h2>
                    <div id="items-container">
                        <div class="item-row">
                            <div class="form-group">
                                <label>Item Name *</label>
                                <input type="text" class="item-name" required>
                            </div>
                            <div class="form-group">
                                <label>Quantity *</label>
                                <input type="number" class="item-quantity" min="1" value="1" required>
                            </div>
                            <div class="form-group">
                                <label>Unit Price *</label>
                                <input type="number" class="item-price" min="0" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Total</label>
                                <input type="text" class="item-total" readonly>
                            </div>
                            <button type="button" class="btn-remove" onclick="removeItem(this)">✕</button>
                        </div>
                    </div>
                    
                    <button type="button" class="btn-secondary" onclick="addItem()">+ Add Item</button>
                </div>

                <div class="form-section">
                    <h2>Tax & Total</h2>
                    <div class="form-group">
                        <label for="tax_rate">Tax Rate (%)</label>
                        <input type="number" id="tax_rate" name="tax_rate" value="15" min="0" max="100" step="0.1">
                    </div>
                    
                    <div class="invoice-summary">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax:</span>
                            <span id="tax">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Grand Total:</span>
                            <span id="grand-total">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Generate Invoice</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>

        <!-- View Invoices Tab -->
        <div id="view-tab" class="tab-content">
            <div class="invoice-list-header">
                <h2>Invoice History</h2>
                <button class="btn-secondary" onclick="loadInvoices()">🔄 Refresh</button>
            </div>
            
            <div id="invoices-container">
                <p class="loading">Loading invoices...</p>
            </div>
        </div>

        <!-- Invoice Detail Modal -->
        <div id="invoice-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <div id="invoice-detail"></div>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div id="message-container"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
